name: Deploy Model to Endpoint

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install azure-ai-ml azure-identity
    
    - name: Azure login
      uses: azure/login@v1
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    
    - name: Grant ACR permissions to workspace
      run: |
        # Get the workspace managed identity
        WORKSPACE_IDENTITY=$(az ml workspace show --name ${{ secrets.WORKSPACE_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} --query identity.principal_id -o tsv)
        
        # Get ACR resource ID
        ACR_ID=$(az ml workspace show --name ${{ secrets.WORKSPACE_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} --query container_registry -o tsv)
        
        # Grant AcrPull and AcrPush permissions
        az role assignment create --assignee $WORKSPACE_IDENTITY --role AcrPull --scope $ACR_ID || true
        az role assignment create --assignee $WORKSPACE_IDENTITY --role AcrPush --scope $ACR_ID || true
    
    - name: Deploy model using Python SDK
      env:
        SUBSCRIPTION_ID: ${{ secrets.SUBSCRIPTION_ID }}
        RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        WORKSPACE_NAME: ${{ secrets.WORKSPACE_NAME }}
        ENDPOINT_NAME: diabetes-endpoint
        DEPLOYMENT_NAME: blue
        MODEL_NAME: diabetes-model@latest
        INSTANCE_TYPE: Standard_DS3_v2
        INSTANCE_COUNT: 1
      run: |
        python deployment/deploy_model.py
