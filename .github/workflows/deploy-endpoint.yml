name: Deploy Model Endpoint

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    
    - name: Install az ml extension
      run: az extension add -n ml -y
    
    - name: Azure login
      uses: azure/login@v1
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    
    - name: Set Azure ML defaults
      run: |
        az configure --defaults group=${{ secrets.RESOURCE_GROUP }} workspace=${{ secrets.WORKSPACE_NAME }}
    
    - name: Grant ACR permissions to workspace
      run: |
        # Get the workspace managed identity
        WORKSPACE_IDENTITY=$(az ml workspace show --name ${{ secrets.WORKSPACE_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} --query identity.principal_id -o tsv)
        
        # Get ACR resource ID
        ACR_ID=$(az ml workspace show --name ${{ secrets.WORKSPACE_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} --query container_registry -o tsv)
        
        # Grant AcrPull and AcrPush permissions
        az role assignment create --assignee $WORKSPACE_IDENTITY --role AcrPull --scope $ACR_ID || true
        az role assignment create --assignee $WORKSPACE_IDENTITY --role AcrPush --scope $ACR_ID || true
    
    - name: Create or update endpoint
      run: |
        az ml online-endpoint create --file deployment/endpoint.yml 2>/dev/null || \
        az ml online-endpoint update --file deployment/endpoint.yml
    
    - name: Delete existing deployment if failed
      run: |
        az ml online-deployment delete --name blue --endpoint-name diabetes-endpoint --yes || true
    
    - name: Create deployment
      run: |
        az ml online-deployment create --file deployment/deployment.yml --all-traffic
    
    - name: Get endpoint details
      run: |
        az ml online-endpoint show --name diabetes-endpoint
