name: Challenge 5

# on:
#   push:
#     branches: ["main"]
on:
  workflow_dispatch:
jobs:
  experiment:
    name: Training model in dev environment
    runs-on: ubuntu-latest
    environment: development
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install Azure CLI
      run: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    - name: Install Azure ML Extensions
      run: |
        az extension add --name ml --yes
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Azure ML defaults
      run: |
        az configure --defaults group=rg-lvela-training workspace=aml-lvela-training
    - name: Run Azure ML job (development)
      run: |
        az ml job create --file src/job.yml --stream

  production:
    name: Train model in production
    runs-on: ubuntu-latest
    needs: experiment
    environment: production
    steps:
    - name: Check out repo
      uses: actions/checkout@main
    - name: Install Azure CLI
      run: |
        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
    - name: Install Azure ML extension
      run: |
        az extension add --name ml --yes
    - name: Azure login
      uses: azure/login@v1
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Set Azure ML defaults
      run: |
        az configure --defaults group=${{ secrets.RESOURCE_GROUP }} workspace=${{ secrets.WORKSPACE_NAME }}
    - name: Run Azure ML job (production)
      id: aml_job
      run: |
        run_id=$(az ml job create --file src/job.yml --set inputs.training_data.path=azureml:diabetes-prod-folder@latest --query name -o tsv)
        echo "run_id=$run_id" >> $GITHUB_OUTPUT
        az ml job stream --name $run_id
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install Python dependencies
      run: |
        pip install azure-ai-ml azure-identity mlflow
    - name: Register trained model
      run: |
        python Model_registry/model_registry_from_job.py \
          --subscription_id ${{ secrets.SUBSCRIPTION_ID }} \
          --resource_group ${{ secrets.RESOURCE_GROUP }} \
          --workspace_name ${{ secrets.WORKSPACE_NAME }} \
          --run-id "${{ steps.aml_job.outputs.run_id }}" \
          --artifact-path "model" \
          --register-model-name "diabetes-model"